<!doctype html>
<html>
  <head>
    <title>{{ title if title else "Shop System" }}</title>

    <style>
      body {
        font-family: Arial;
        background: linear-gradient(120deg, #f4f6f8, #e8f0ff);
        padding: 30px;
      }

      .card {
        background: white;
        padding: 15px;
        margin: 10px;
        border-radius: 12px;
        display: inline-block;
        width: 220px;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      a.nav-btn {
        padding: 10px 15px;
        background: #2c3e50;
        color: white;
        border-radius: 8px;
        text-decoration: none;
      }

      a.nav-btn:hover {
        background: #34495e;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: white;
        border-radius: 10px;
        overflow: hidden;
      }

      th {
        background-color: #2c3e50;
        color: white;
        padding: 12px;
      }

      td {
        padding: 10px;
        text-align: center;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }
      .spacing {
        margin-top: 30px;
      }
      input {
        width: 90%;
        padding: 8px;
        margin-top: 5px;
      }

      label {
        font-weight: bold;
      }

      .nav-btn {
        padding: 10px 15px;
        background: #2c3e50;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        display: inline-block;
      }

      .nav-btn:hover {
        background: #1a252f;
      }
    </style>
  </head>

  <body>
    {% block content %}{% endblock %}
  </body>
</html>
