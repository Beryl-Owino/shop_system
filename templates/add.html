{% extends "base.html" %} {% block content %}
<h1>Add Sale</h1>

<form method="POST" class="card">
  <label>Item:</label><br />
  <input type="text" name="item" required /><br /><br />

  <label>Variant:</label><br />
  <input type="text" name="variant" required /><br /><br />

  <label>Quantity:</label><br />
  <input type="number" name="qty" required /><br /><br />

  <label>Price:</label><br />
  <input type="number" name="price" required /><br /><br />

  <label>Cost:</label><br />
  <input type="number" name="cost" required /><br /><br />

  <button type="submit" class="nav-btn">Save Sale</button>
</form>

<div class="back">
  <a href="/" class="nav-btn">⬅ Back Home</a>
</div>

{% endblock %}
